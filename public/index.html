<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLess</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>🧘 MindLess</h1>
    <p>Libère ta charge mentale du quotidien.</p>
  </header>

  <main>
    <!-- Tuiles des modules ouverts à l'utilisateur (insérées ici depuis coeur/utils/Modules.js),
         suivies des tuiles du cœur, toujours présentes. -->
    <div class="nav-accueil" id="nav-accueil">
      <a href="settings.html" class="nav-tuile">
        <span class="icone">⚙️</span>
        <span class="titre">Settings</span>
      </a>
      <a href="admin.html" class="nav-tuile hidden" id="tuile-admin">
        <span class="icone">🛠️</span>
        <span class="titre">Admin</span>
      </a>
    </div>

    <p id="aucun-module" class="vide hidden">
      Aucun module ne t'est encore ouvert. L'administrateur du foyer peut t'en donner l'accès depuis
      sa page Admin.
    </p>

    <p style="text-align:center">
      <a href="#" id="btn-deconnexion">Se déconnecter</a>
    </p>
  </main>

  <script type="module">
    import { AuthService } from './coeur/services/AuthService.js';
    import { ouvrirSession } from './coeur/services/Session.js';
    import { MODULES } from './coeur/utils/Modules.js';

    document.getElementById('btn-deconnexion').addEventListener('click', async (e) => {
      e.preventDefault();
      await AuthService.seDeconnecter();
    });

    function creerTuile(module) {
      const tuile = document.createElement('a');
      tuile.href = module.page;
      tuile.className = 'nav-tuile';
      tuile.innerHTML = `
        <span class="icone">${module.icone}</span>
        <span class="titre">${module.libelle}</span>
        <span class="tuile-badge hidden"></span>
      `;
      return tuile;
    }

    // Point d'extension `badgeAccueil` : le code du module n'est chargé que s'il est ouvert à
    // l'utilisateur. Un échec n'empêche jamais l'affichage de l'accueil.
    async function afficherBadge(module, tuile, foyerId) {
      const { calculerBadge } = await import(`./modules/${module.id}/accueil.js`);
      const total = await calculerBadge(foyerId);
      if (total > 0) {
        const badge = tuile.querySelector('.tuile-badge');
        badge.textContent = total;
        badge.classList.remove('hidden');
      }
    }

    const session = await ouvrirSession();
    const nav = document.getElementById('nav-accueil');
    const premiereTuileCoeur = nav.firstElementChild;
    const modulesOuverts = MODULES.filter((m) => session.modules.includes(m.id));

    modulesOuverts.forEach((module) => {
      const tuile = creerTuile(module);
      nav.insertBefore(tuile, premiereTuileCoeur);
      if (module.badgeAccueil) afficherBadge(module, tuile, session.foyer.id).catch(() => {});
    });

    document.getElementById('aucun-module').classList.toggle('hidden', modulesOuverts.length > 0);
    if (session.estAdministrateur) document.getElementById('tuile-admin').classList.remove('hidden');
  </script>

</body>
</html>
