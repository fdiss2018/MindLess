<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLess - Connexion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1>🧘 MindLess</h1>
    <p>Libère ta charge mentale du quotidien.</p>
  </header>

  <main>
    <div class="carte">
      <p class="carte-titre">Connexion</p>
      <p class="carte-desc">Connecte-toi avec ton compte Google pour retrouver les données de ton foyer.</p>

      <button id="btn-google" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="20" height="20">
        Continuer avec Google
      </button>
      <p id="msg-google" class="msg hidden"></p>
    </div>
  </main>

  <script type="module">
    import { AuthService } from './commun/services/AuthService.js';
    import { UtilisateurService } from './commun/services/UtilisateurService.js';

    const btnGoogle = document.getElementById('btn-google');
    const msgGoogle = document.getElementById('msg-google');

    btnGoogle.addEventListener('click', async () => {
      btnGoogle.disabled = true;
      msgGoogle.classList.add('hidden');
      try {
        const user = await AuthService.seConnecterAvecGoogle();
        const utilisateur = await UtilisateurService.obtenirOuCreerUtilisateur(user);
        window.location.href = utilisateur.foyerId ? 'index.html' : 'foyer.html';
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          msgGoogle.textContent = err.message || 'Une erreur est survenue.';
          msgGoogle.className = 'msg msg-erreur';
          msgGoogle.classList.remove('hidden');
        }
        btnGoogle.disabled = false;
      }
    });

    // Déjà connecté : redirection directe (pas de formulaire à ré-afficher).
    AuthService.ecouterAuth(async (user) => {
      if (!user) return;
      const utilisateur = await UtilisateurService.obtenirOuCreerUtilisateur(user);
      window.location.href = utilisateur.foyerId ? 'index.html' : 'foyer.html';
    });
  </script>

</body>
</html>
