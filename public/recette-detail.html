<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLess - Recette</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="entete">
    <h1 id="titre">📚 Recette</h1>
    <p id="sous-titre"></p>
  </header>

  <main>
    <a href="recettes.html" class="lien-retour">← Retour</a>

    <div class="carte">
      <p class="carte-titre">Ingrédients</p>
      <div id="liste-ingredients"></div>
    </div>

    <div class="carte">
      <p class="carte-titre">Instructions</p>
      <p id="instructions" class="carte-desc" style="white-space:pre-wrap"></p>
    </div>

    <a id="lien-modifier" href="#" class="btn-secondaire btn-large">Modifier cette recette</a>
    <p id="chargement" class="chargement">Chargement...</p>
  </main>

  <script type="module">
    import { AuthService } from './services/AuthService.js';
    import { UtilisateurService } from './services/UtilisateurService.js';
    import { RecetteService } from './services/RecetteService.js';

    const params = new URLSearchParams(window.location.search);
    const recetteId = params.get('id');
    document.getElementById('lien-modifier').href = `recette-form.html?id=${recetteId}`;

    AuthService.ecouterAuth(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const utilisateur = await UtilisateurService.obtenirOuCreerUtilisateur(user);
      if (!utilisateur.foyerId) { window.location.href = 'foyer.html'; return; }

      const recette = await RecetteService.obtenirRecette(utilisateur.foyerId, recetteId);
      document.getElementById('chargement').classList.add('hidden');
      if (!recette) { window.location.href = 'recettes.html'; return; }

      document.getElementById('titre').textContent = `📚 ${recette.nom}`;
      document.getElementById('sous-titre').textContent =
        `${recette.portions} portions${recette.tags.length ? ' · ' + recette.tags.join(', ') : ''}`;
      document.getElementById('instructions').textContent = recette.instructions || 'Aucune instruction renseignée.';

      const liste = document.getElementById('liste-ingredients');
      recette.ingredients.forEach((ingredient) => {
        const div = document.createElement('div');
        div.className = 'liste-item';
        div.innerHTML = `
          <div class="liste-item-info">
            <p class="liste-item-nom">${ingredient.nom}</p>
          </div>
          <span class="badge">${ingredient.quantite} ${ingredient.unite}</span>
        `;
        liste.appendChild(div);
      });
    });
  </script>

</body>
</html>
